<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
<title id="title">Windows Security Event Analysis — verified findings and monitoring gaps</title>
<desc id="desc">Four event counts from one query: 638 successful logons, 614 special privilege assignments, 37 logoffs, and 13 process creations. A separate logon ID correlation was found. Retained log span was 2.03 days and process creation auditing was disabled at the time of inspection. No security incident was confirmed.</desc>
